# Cargo build configuration for Cartridge OS

[build]
# Default target for bare-metal components
target = "x86_64-unknown-none"

# Tooling builds for host system
[alias]
build-tools = "build --package cartridge-packager --package cartridge-verifier --target x86_64-pc-windows-msvc"
build-kernel = "build --package cartridge-kernel --target x86_64-unknown-none"
build-bootloader = "build --package cartridge-bootloader --target x86_64-unknown-uefi"

# Cross-compilation targets
[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tkernel/linker.ld",
    "-C", "relocation-model=static",
]

[target.x86_64-unknown-uefi]
rustflags = [
    "-C", "link-arg=/subsystem:efi_application",
]
